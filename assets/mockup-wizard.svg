<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="720" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="70" font-size="28" font-weight="700" fill="#0f172a">Criar chatbot</text>
  <text x="60" y="98" font-size="15" fill="#64748b">Responda algumas perguntas simples. A IA faz o resto.</text>
  <!-- stepper -->
  <g font-size="13" text-anchor="middle">
    <circle cx="110" cy="160" r="18" fill="#4f46e5"/><text x="110" y="165" fill="#fff" font-weight="700">1</text><text x="110" y="198" fill="#4f46e5" font-weight="600">Negócio</text>
    <rect x="132" y="158" width="140" height="4" fill="#c7d2fe"/>
    <circle cx="294" cy="160" r="18" fill="#e0e7ff"/><text x="294" y="165" fill="#4f46e5" font-weight="700">2</text><text x="294" y="198" fill="#64748b">Personalidade</text>
    <rect x="316" y="158" width="140" height="4" fill="#e2e8f0"/>
    <circle cx="478" cy="160" r="18" fill="#e0e7ff"/><text x="478" y="165" fill="#4f46e5" font-weight="700">3</text><text x="478" y="198" fill="#64748b">Conhecimento</text>
    <rect x="500" y="158" width="140" height="4" fill="#e2e8f0"/>
    <circle cx="662" cy="160" r="18" fill="#e0e7ff"/><text x="662" y="165" fill="#4f46e5" font-weight="700">4</text><text x="662" y="198" fill="#64748b">Testar</text>
    <rect x="684" y="158" width="140" height="4" fill="#e2e8f0"/>
    <circle cx="846" cy="160" r="18" fill="#e0e7ff"/><text x="846" y="165" fill="#4f46e5" font-weight="700">5</text><text x="846" y="198" fill="#64748b">Publicar</text>
  </g>
  <!-- form card -->
  <rect x="60" y="240" width="760" height="420" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <text x="90" y="285" font-size="18" font-weight="700" fill="#0f172a">Conte sobre o seu negócio</text>
  <g font-size="13" fill="#475569">
    <text x="90" y="325">Nome da empresa</text>
    <rect x="90" y="335" width="700" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="106" y="362" fill="#0f172a" font-size="15">Clínica Exemplo</text>
    <text x="90" y="410">Segmento</text>
    <rect x="90" y="420" width="700" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="106" y="447" fill="#0f172a" font-size="15">Saúde · Odontologia</text>
    <text x="90" y="495">Serviços e horários de funcionamento</text>
    <rect x="90" y="505" width="700" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="106" y="535" fill="#0f172a" font-size="15">Limpeza, clareamento, ortodontia. Seg–Sex, 8h às 18h.</text>
  </g>
  <rect x="640" y="610" width="150" height="40" rx="10" fill="#4f46e5"/><text x="672" y="635" font-size="15" font-weight="600" fill="#fff">Continuar →</text>
  <!-- AI tip -->
  <rect x="850" y="240" width="290" height="200" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="872" y="278" font-size="16" font-weight="700" fill="#3730a3">Dica da IA</text>
  <text x="872" y="310" font-size="14" fill="#4338ca">Quanto mais detalhes sobre</text>
  <text x="872" y="332" font-size="14" fill="#4338ca">seus serviços, melhores serão</text>
  <text x="872" y="354" font-size="14" fill="#4338ca">as respostas. Vamos transformar</text>
  <text x="872" y="376" font-size="14" fill="#4338ca">isso em instruções para o seu</text>
  <text x="872" y="398" font-size="14" fill="#4338ca">assistente automaticamente.</text>
  <text x="850" y="700" font-size="12" fill="#94a3b8">Mockup conceitual — dados fictícios</text>
</svg>
