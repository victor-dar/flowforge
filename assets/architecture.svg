<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Arquitetura prevista</text>
  <!-- clients -->
  <rect x="40" y="110" width="200" height="90" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="140" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Painel Web</text>
  <text x="140" y="172" text-anchor="middle" font-size="13" fill="#4338ca">React + TS + Vite + Tailwind</text>
  <rect x="40" y="300" width="200" height="90" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="140" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">Widget no site</text>
  <text x="140" y="362" text-anchor="middle" font-size="13" fill="#0e7490">JS incorporável</text>
  <!-- API -->
  <rect x="340" y="190" width="240" height="210" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="460" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">API FastAPI</text>
  <g font-size="13" fill="#6d28d9" text-anchor="middle">
    <text x="460" y="262">Auth · Chatbots · Conversas</text>
    <text x="460" y="286">Base de conhecimento</text>
    <text x="460" y="310">Orquestrador de chat (RAG)</text>
    <text x="460" y="334">Limites de uso · Rate limit</text>
    <text x="460" y="370" font-weight="600">Python · SQLAlchemy</text>
  </g>
  <!-- data -->
  <rect x="700" y="90" width="210" height="80" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="805" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">PostgreSQL</text>
  <text x="805" y="148" text-anchor="middle" font-size="13" fill="#15803d">usuários · bots · conversas</text>
  <rect x="700" y="200" width="210" height="80" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="805" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Qdrant</text>
  <text x="805" y="258" text-anchor="middle" font-size="13" fill="#c2410c">vetores da base (RAG)</text>
  <rect x="700" y="310" width="210" height="80" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="805" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Redis</text>
  <text x="805" y="368" text-anchor="middle" font-size="13" fill="#b91c1c">cache · filas · rate limit</text>
  <!-- worker -->
  <rect x="700" y="420" width="210" height="80" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="805" y="454" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Worker</text>
  <text x="805" y="478" text-anchor="middle" font-size="13" fill="#475569">processa documentos (PDF/TXT)</text>
  <!-- LLM -->
  <rect x="980" y="190" width="190" height="210" rx="14" fill="#fdf4ff" stroke="#f0abfc"/>
  <text x="1075" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#86198f">Camada de IA</text>
  <g font-size="13" fill="#a21caf" text-anchor="middle">
    <text x="1075" y="262">independente de provedor</text>
    <text x="1075" y="298">LLM A · LLM B · LLM C…</text>
    <text x="1075" y="334">Embeddings</text>
  </g>
  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M240 155 L340 230"/><path d="M240 345 L340 350"/>
    <path d="M580 250 L700 130"/><path d="M580 270 L700 240"/><path d="M580 320 L700 350"/>
    <path d="M580 370 L700 450"/><path d="M910 450 L980 380"/><path d="M580 300 L980 300"/>
  </g>
  <text x="40" y="600" font-size="13" fill="#64748b">Tudo containerizado com Docker · Testes com Pytest · Isolamento de dados por usuário (tenant)</text>
</svg>
