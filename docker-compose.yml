services:
  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////data/flowforge.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-deploying}
      CORS_ORIGINS: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE: ${PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE:-20}
      PUBLIC_CHAT_DAILY_LIMIT_PER_BOT: ${PUBLIC_CHAT_DAILY_LIMIT_PER_BOT:-500}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
      WIDGET_CAPABILITY_PER_MINUTE: ${WIDGET_CAPABILITY_PER_MINUTE:-60}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-5242880}
      MAX_DOCUMENT_CHARACTERS: ${MAX_DOCUMENT_CHARACTERS:-500000}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@flowforge.local}
    volumes:
      - flowforge_data:/data
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  flowforge_data:
