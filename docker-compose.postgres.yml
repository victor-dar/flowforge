services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - flowforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowforge}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE: ${PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE:-20}
      PUBLIC_CHAT_DAILY_LIMIT_PER_BOT: ${PUBLIC_CHAT_DAILY_LIMIT_PER_BOT:-500}
      WIDGET_CAPABILITY_PER_MINUTE: ${WIDGET_CAPABILITY_PER_MINUTE:-60}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-5242880}
      MAX_DOCUMENT_CHARACTERS: ${MAX_DOCUMENT_CHARACTERS:-500000}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@flowforge.local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  flowforge_postgres_data:
